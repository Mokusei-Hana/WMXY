name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "DormHomeAndroid/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release with the built APK"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    name: Build DormHome Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run Unit Tests & Build Debug APK
        working-directory: DormHomeAndroid
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Package APK
        id: package
        run: |
          APK_SRC="DormHomeAndroid/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "APK not found at $APK_SRC"
            exit 1
          fi

          mkdir -p build
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
            APK_NAME="DormHome-${VERSION_TAG}-android.apk"
          else
            APK_NAME="DormHome-${SHORT_SHA}-android.apk"
          fi

          cp "$APK_SRC" "build/${APK_NAME}"
          ls -lh "build/${APK_NAME}"

          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=build/${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DormHome-APK
          path: ${{ steps.package.outputs.apk_path }}
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('android-build-{0}', github.run_number) }}"
          name: "${{ startsWith(github.ref, 'refs/tags/v') && format('DormHome {0}', github.ref_name) || format('DormHome Android Build {0}', github.run_number) }}"
          body: |
            自动构建的 `DormHome`（宿享）Android APK 安装包（支持 Android 8.0 / API 26+）。
          files: ${{ steps.package.outputs.apk_path }}
